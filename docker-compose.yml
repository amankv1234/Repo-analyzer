services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repomentor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repomentor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repomentor_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-repomentor}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repomentor} -d ${POSTGRES_DB:-repomentor}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - repomentor-network

  redis:
    image: redis:7-alpine
    container_name: repomentor-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - repomentor-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: repomentor-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-repomentor}:${POSTGRES_PASSWORD:-repomentor_dev_secret}@postgres:5432/${POSTGRES_DB:-repomentor}
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-voyage}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - repomentor-network

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: repomentor-worker
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-repomentor}:${POSTGRES_PASSWORD:-repomentor_dev_secret}@postgres:5432/${POSTGRES_DB:-repomentor}
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-voyage}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - repomentor-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: repomentor-web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - repomentor-network

volumes:
  postgres_data:
  redis_data:

networks:
  repomentor-network:
    driver: bridge

