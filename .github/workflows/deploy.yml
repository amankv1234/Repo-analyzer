name: CD Pipeline - Staging

on:
  push:
    branches: [main]

jobs:
  deploy-staging:
    name: Deploy to Staging Cluster
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Trigger Staging Webhook
        run: |
          echo "Simulating automated staging deployment to Railway / Render cluster..."
          echo "Database migrations applied via: pnpm --filter @repomentor/db db:migrate"
          echo "Containers updated with zero downtime rolling restart."

