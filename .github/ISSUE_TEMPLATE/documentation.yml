name: 📚 Documentation Improvement
description: Suggest improvements, report typos, or suggest new onboarding guides
labels: ["docs", "good first issue"]
body:
  - type: textarea
    id: issue_description
    attributes:
      label: Documentation Issue Description
      description: Which document needs improvement and what changes are needed?
    validations:
      required: true
  - type: input
    id: doc_path
    attributes:
      label: Document Path
      placeholder: "e.g. docs/getting-started.md"
    validations:
      required: true
  - type: checkboxes
    id: pr_ready
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a pull request with this documentation fix

