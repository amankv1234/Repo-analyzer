name: 💡 Feature Request
description: Propose a new capability, parser, or enhancement for RepoMentor
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        We love new ideas! Before proposing, please check [docs/roadmap.md](docs/roadmap.md) to see if it's already planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What pain point or onboarding challenge does this feature address?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Detailed description of the proposed feature, including target packages (e.g. apps/web, packages/core).
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Target Area
      options:
        - "Frontend (apps/web)"
        - "API Gateway (apps/api)"
        - "Worker & Ingestion (apps/worker)"
        - "AST Parsing & Languages (packages/core)"
        - "RAG & Retrieval (packages/core)"
        - "Memory Engine (packages/core)"
        - "Documentation / DX"
    validations:
      required: true
  - type: checkboxes
    id: willingness
    attributes:
      label: Implementation
      options:
        - label: I am willing to submit a pull request implementing this feature

