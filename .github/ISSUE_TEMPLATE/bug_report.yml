name: 🐛 Bug Report
description: Report a reproducible problem or unexpected behavior in RepoMentor
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please verify the issue hasn't already been reported in [GitHub Issues](https://github.com/your-org/repomentor/issues).
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Node.js, OS, and pnpm versions (or output of `pnpm doctor`)
      placeholder: "e.g. Node 22.2.0, Windows 11, pnpm 9.15.4"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: LLM & Embedding Mode
      description: Which provider were you using when the issue occurred?
      options:
        - "Free Google Gemini Mode"
        - "Offline Mock Mode"
        - "Anthropic Claude Mode"
        - "Voyage AI Embeddings"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Numbered steps to reproduce the issue.
      placeholder: |
        1. Paste repository URL 'https://github.com/...'
        2. Wait for indexing stage 3
        3. See error in browser console
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Paste terminal or browser console logs here.
      render: shell

