version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repomentor-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repomentor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repomentor_secure_prod}
      POSTGRES_DB: ${POSTGRES_DB:-repomentor_prod}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repomentor -d repomentor_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  redis:
    image: redis:7-alpine
    container_name: repomentor-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_secure_prod}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_prod}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: repomentor-prod-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-repomentor}:${POSTGRES_PASSWORD:-repomentor_secure_prod}@postgres:5432/${POSTGRES_DB:-repomentor_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_prod}@redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-repomentor_prod_jwt_secret_must_be_32_bytes_long}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: repomentor-prod-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-repomentor}:${POSTGRES_PASSWORD:-repomentor_secure_prod}@postgres:5432/${POSTGRES_DB:-repomentor_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_prod}@redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: repomentor-prod-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

